<div class="forgot-container">
  <!-- Header -->
  <header class="header">
    <button class="back-btn" (click)="goBack()" aria-label="Volver">
      <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
        <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/>
      </svg>
    </button>
    <div class="logo">
      <span class="logo-text">Vehi<span class="logo-sos">SOS</span></span>
    </div>
    <div class="user-icon">
      <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
        <path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/>
      </svg>
    </div>
  </header>

  <!-- Main Content -->
  <main class="content">
    <div class="card" *ngIf="!showSuccess()">
      <h1 class="title">Recuperar contraseña</h1>
      <p class="subtitle">Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.</p>

      <form [formGroup]="forgotForm" (ngSubmit)="submitForgot()" class="forgot-form">
        <!-- Email -->
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-container">
            <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
              <path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280 320-200v-240L480-480 160-680v240l320 200Z"/>
            </svg>
            <input type="email" id="email" formControlName="email" placeholder="correo@ejemplo.com" [class.invalid]="isFieldInvalid('email')">
          </div>
          <span class="error-msg" *ngIf="isFieldInvalid('email')">Ingresa un correo válido</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" [disabled]="forgotForm.invalid">
          Enviar instrucciones
        </button>
      </form>

      <div class="footer-links">
        <a (click)="goBack()" class="back-link">Volver al inicio de sesión</a>
      </div>
    </div>

    <!-- Success State -->
    <div class="card success-card" *ngIf="showSuccess()">
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" height="80" viewBox="0 -960 960 960" width="80" fill="#4CAF50">
          <path d="m424-296 282-282-56-56-226 226-114-114-56 56 170 170Zm56 216q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/>
        </svg>
      </div>
      <h2 class="title">Correo enviado</h2>
      <p class="subtitle">Hemos enviado las instrucciones de recuperación a tu bandeja de entrada. Por favor, revisa tu correo.</p>
      <button class="submit-btn" (click)="goBack()">Entendido</button>
    </div>
  </main>
</div>
