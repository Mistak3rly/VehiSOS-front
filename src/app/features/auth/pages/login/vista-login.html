<div class="login-container">
  <!-- Header -->
  <header class="header">
    <button class="menu-btn" aria-label="Menú">
      <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
        <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
      </svg>
    </button>
    <div class="logo">
      <span class="logo-text">Vehi<span class="logo-sos">SOS</span></span>
    </div>
    <div class="user-icon">
      <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
        <path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/>
      </svg>
    </div>
  </header>

  <!-- Main Content -->
  <main class="content">
    <div class="card">
      <h1 class="title">Iniciar sesión</h1>
      <p class="subtitle">Accede a tu cuenta para gestionar asistencia vehicular.</p>

      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()" class="login-form">
        <!-- Identificador -->
        <div class="form-group">
          <label for="identificador">Usuario o Correo</label>
          <div class="input-container">
            <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
              <path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280 320-200v-240L480-480 160-680v240l320 200Z"/>
            </svg>
            <input type="text" id="identificador" formControlName="identificador" placeholder="Usuario o correo" [class.invalid]="isFieldInvalid('identificador')">
          </div>
          <span class="error-msg" *ngIf="isFieldInvalid('identificador')">El identificador es obligatorio</span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-container">
            <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
              <path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM320-640h320v-80q0-66-47-113t-113-47q-66 0-113 47t-47 113v80Z"/>
            </svg>
            <input type="password" id="password" formControlName="password" placeholder="Tu contraseña" [class.invalid]="isFieldInvalid('password')">
          </div>
          <span class="error-msg" *ngIf="isFieldInvalid('password')">La contraseña es obligatoria</span>
        </div>

        <div class="login-options">
          <div class="form-check">
            <input type="checkbox" id="remember" formControlName="remember">
            <label for="remember">Recordarme</label>
          </div>
          <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Global Error Message -->
        <div class="global-error" *ngIf="errorMessage()">
          {{ errorMessage() }}
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading()">
          {{ isLoading() ? 'Iniciando sesión...' : 'Ingresar' }}
        </button>
      </form>

      <div class="footer-links">
        <span>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></span>
      </div>
    </div>
  </main>
</div>
