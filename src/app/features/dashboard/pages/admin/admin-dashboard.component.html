<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="welcome">
      <h1>Dashboard Administrativo</h1>
      <p>Gestión global de la plataforma VehiSOS.</p>
    </div>
  </header>

  <section class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats" [class]="stat.color">
      <div class="stat-icon">
        <span class="material-icons-round">{{ stat.icon }}</span>
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ stat.value }}</span>
        <span class="stat-title">{{ stat.title }}</span>
      </div>
    </div>
  </section>

  <div class="content-grid">
    <!-- Pending Workshops -->
    <section class="activity-section card">
      <div class="section-header">
        <h2>Talleres por Aprobar</h2>
      </div>
      <div class="activity-list">
        <div class="activity-item" *ngFor="let workshop of pendingWorkshops">
          <div class="activity-info">
            <span class="activity-desc">{{ workshop.name }}</span>
            <span class="activity-time">{{ workshop.location }} - {{ workshop.date }}</span>
          </div>
          <div class="action-buttons" style="display: flex; gap: 8px;">
            <button style="background: #4CAF50; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer;">Aprobar</button>
            <button style="background: #f44336; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer;">Rechazar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Audit Logs -->
    <section class="activity-section card">
      <div class="section-header">
        <h2>Últimos Registros de Auditoría</h2>
      </div>
      <div class="activity-list">
        <div class="activity-item" *ngFor="let log of auditLogs">
          <div class="activity-info">
            <span class="activity-desc">{{ log.action }}</span>
            <span class="activity-time">{{ log.user }} - {{ log.time }}</span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
