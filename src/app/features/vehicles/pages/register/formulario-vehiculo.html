<div class="registration-container">
  <!-- Header -->
  <header class="page-header">
    <h1>Registrar vehículo</h1>
    <p>Agrega los datos de tu vehículo para facilitar futuros reportes de emergencia.</p>
  </header>

  <!-- Form Card -->
  <section class="form-card card">
    <div class="section-header">
      <span class="material-icons-round">directions_car</span>
      <h2>Datos del Vehículo</h2>
    </div>
    
    <form [formGroup]="vehicleForm" (ngSubmit)="guardarVehiculo()">
      <div class="form-grid">
        <div class="form-group">
          <label for="placa">Placa</label>
          <input type="text" id="placa" formControlName="placa" placeholder="Ej. ABC-123">
          <small class="error" *ngIf="vehicleForm.get('placa')?.invalid && vehicleForm.get('placa')?.touched">
            La placa es obligatoria.
          </small>
        </div>

        <div class="form-group">
          <label for="marca">Marca</label>
          <input type="text" id="marca" formControlName="marca" placeholder="Ej. Toyota">
          <small class="error" *ngIf="vehicleForm.get('marca')?.invalid && vehicleForm.get('marca')?.touched">
            La marca es obligatoria.
          </small>
        </div>

        <div class="form-group">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" formControlName="modelo" placeholder="Ej. Hilux">
          <small class="error" *ngIf="vehicleForm.get('modelo')?.invalid && vehicleForm.get('modelo')?.touched">
            El modelo es obligatorio.
          </small>
        </div>

        <div class="form-group">
          <label for="year">Año</label>
          <input type="number" id="year" formControlName="year" [placeholder]="currentYear">
          <small class="error" *ngIf="vehicleForm.get('year')?.invalid && vehicleForm.get('year')?.touched">
            Ingresa un año válido (1900 - {{currentYear}}).
          </small>
        </div>

        <div class="form-group">
          <label for="color">Color</label>
          <input type="text" id="color" formControlName="color" placeholder="Ej. Rojo">
          <small class="error" *ngIf="vehicleForm.get('color')?.invalid && vehicleForm.get('color')?.touched">
            El color es obligatorio.
          </small>
        </div>

        <div class="form-group full-width">
          <label for="observaciones">Observaciones (Opcional)</label>
          <textarea id="observaciones" formControlName="observaciones" placeholder="Ej. El vehículo tiene un golpe en la puerta trasera izquierda..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-outline" (click)="cancelar()">
          Cancelar
        </button>
        <button type="submit" class="btn-primary" [disabled]="vehicleForm.invalid">
          Guardar vehículo
        </button>
      </div>
    </form>
  </section>
</div>
